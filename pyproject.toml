[project]
name = "papiers-autoresearch-workshop"
version = "0.1.0"
description = "A small, real, CPU autoresearch loop for Hack the Valley."
requires-python = ">=3.11,<3.15"
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3"]

[dependency-groups]
dev = ["jupyterlab>=4.3,<5", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "matplotlib>=3.9,<4", "ipykernel>=6.29,<8"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

